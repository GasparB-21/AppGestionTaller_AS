<!--He usado IA para añadir Bootstrap y mejorar el aspecto visual, dejado el codigo original abajo-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de clientes</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Título -->
    <div class="mb-4">
        <h1 class="fw-bold">Listado de clientes</h1>
        <p class="text-muted">Clientes registrados en el taller</p>
    </div>

    <!-- Card contenedora -->
    <div class="card shadow-sm">
        <div class="card-body">

            {% if clientes %}

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for cliente in clientes %}

                        <tr>
                            <td>{{ cliente.id }}</td>

                            <td>
                                <a href="{% url 'buscar_cliente_id' cliente.id %}" 
                                   class="text-decoration-none fw-semibold">
                                   {{ cliente.nombre }}
                                </a>
                            </td>

                            <td>{{ cliente.telefono }}</td>

                            <td>
                                <a href="mailto:{{ cliente.email }}" class="text-decoration-none">
                                    {{ cliente.email }}
                                </a>
                            </td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

            {% else %}

            <div class="alert alert-info">
                No hay clientes registrados en el sistema.
            </div>

            {% endif %}

        </div>
    </div>

</div>

</body>
</html>
