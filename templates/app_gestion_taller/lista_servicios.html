<!--He usado IA para añadir Bootstrap y mejorar el aspecto visual, dejado el codigo original abajo-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios del taller</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Título -->
    <div class="mb-4">
        <h1 class="fw-bold">Servicios ofrecidos por el taller</h1>
        <p class="text-muted">Listado de servicios disponibles</p>
    </div>

    <!-- Card contenedora -->
    <div class="card shadow-sm">
        <div class="card-body">

            {% if servicios %}

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for servicio in servicios %}

                        <tr>
                            <td class="fw-semibold">
                                {{ servicio.nombre }}
                            </td>

                            <td>
                                {{ servicio.descripcion }}
                            </td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

            {% else %}

            <div class="alert alert-info">
                No hay servicios registrados en el sistema.
            </div>

            {% endif %}

        </div>
    </div>

</div>

</body>
</html>
